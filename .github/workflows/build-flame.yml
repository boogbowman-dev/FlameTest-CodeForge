name: Build V10 Scenes Test

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract V10.2 project
        run: unzip V104PlatformerFixedCI.zip

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android host and verify game
        working-directory: V10ScenesTest
        run: bash tool/bootstrap_android.sh

      - name: Build release APK
        working-directory: V10ScenesTest
        run: flutter build apk --release

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: V10ScenesTest-release-apk
          path: V10ScenesTest/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
